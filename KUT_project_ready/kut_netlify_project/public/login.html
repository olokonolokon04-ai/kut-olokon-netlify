<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — КУТ</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eaf3fc,#cfe5fa);font:15px Arial,sans-serif;color:#172b4d;display:grid;place-items:center}.box{width:min(420px,calc(100% - 28px));background:white;border-radius:16px;padding:28px;box-shadow:0 12px 35px #09265f22}.logo{background:linear-gradient(120deg,#06326f,#1682d3);color:white;border-radius:12px;padding:18px;margin:-4px -4px 20px}.logo h1{margin:0 0 6px;font-size:24px}.logo p{margin:0;font-size:13px;opacity:.9}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #b9c9dd;border-radius:8px;font-size:15px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#16804b;color:white;font-weight:bold;font-size:15px;cursor:pointer;margin-top:10px}button:disabled{opacity:.6}.hint{font-size:12px;color:#64748b;line-height:1.5}.error{color:#b42318;font-size:13px;min-height:20px}</style></head><body><main class="box"><header class="logo"><h1>КУТ — ЖК «Олокон»</h1><p>Общая база оформления пропусков</p></header><form id="loginForm"><div class="field"><label for="username">Логин</label><input id="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><div id="error" class="error"></div><button id="submit" type="submit">Войти</button></form><p class="hint">Доступ предоставляется администратором. Не используйте общий логин на нескольких компьютерах — каждому сотруднику лучше создать отдельную учётную запись.</p></main><script>const form=document.getElementById('loginForm');form.addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;b.textContent='Проверяю...';err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},credentials:'same-origin',body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Не удалось войти');location.href='/'}catch(x){err.textContent=x.message}finally{b.disabled=false;b.textContent='Войти'}});</script></body></html>
